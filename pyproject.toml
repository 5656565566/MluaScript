[project]
name = "MluaScript"
version = "1.0.1"
description = "MaaFramework-driven script controller"
authors = [
    {name = "5656565566", email = "2393963330@qq.com"},
]
dependencies = [
    "maafw>=5.14.0",
    "loguru>=0.7.3",
    "textual>=8.2.8",
    "rich>=15.0.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "keyboard>=0.13.5",
    "lupa>=2.8",
    "pillow>=12.3.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.54.0",
    "pyinstaller>=6.22.3",
    "plyer>=2.1.0",
    "httpx>=0.28.1",
    "playwright>=1.63.0",
]
requires-python = "==3.12.*"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--strict-markers",
    "--tb=short",
    "--cov=src/mluascript",
#    "--cov-report=html",
    "--cov-report=term-missing",
#    "--cov-fail-under=70",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: unit tests",
]

[project.scripts]
mluascript = "mluascript.__main__:main"

[tool.coverage.run]
omit = [
    "src/mluascript/tui/*",  # 排除整个 tui 目录
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mluascript*"]
